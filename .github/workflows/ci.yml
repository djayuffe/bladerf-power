name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install numpy scipy Pillow
      - name: Compile source
        run: python -m py_compile bladerf_power.py bladerf_backend.py heatmap.py spectrum_math.py
      - name: Run hardware-free tests
        run: python -m unittest discover -s tests
