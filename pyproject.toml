[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bladerf-power"
version = "0.7.2"
description = "Receive-only bladeRF spectrum survey and heatmap tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "Pillow>=9.0"]

[project.scripts]
bladerf-power = "bladerf_power:main"
bladerf-heatmap = "heatmap:main"
bladerf-diagnostics = "bladerf_diagnostics:main"

[tool.setuptools]
py-modules = ["bladerf_power", "bladerf_backend", "bladerf_diagnostics", "capture_io", "heatmap", "spectrum_math"]
